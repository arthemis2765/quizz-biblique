<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📖 Bible Quiz</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#38bdf8">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
/* ================= VARIABLES & THÈMES ================= */
:root {
  --bg-color: #0f172a;
  --glass: rgba(255, 255, 255, 0.05);
  --glass-border: rgba(255, 255, 255, 0.1);
  --text: #f8fafc;
  --text-dim: #94a3b8;
  --accent: #38bdf8;
  --success: #22c55e;
  --danger: #ef4444;
  --warning: #f59e0b;
}

[data-theme="light"] {
  --bg-color: #f1f5f9;
  --glass: rgba(255, 255, 255, 0.85);
  --glass-border: rgba(0, 0, 0, 0.08);
  --text: #0f172a;
  --text-dim: #64748b;
  --accent: #0284c7;
  --success: #16a34a;
  --danger: #dc2626;
  --warning: #d97706;
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif; }

body {
  min-height: 100vh;
  color: var(--text);
  background-color: var(--bg-color);
  transition: background-color 0.4s ease, color 0.4s ease;
  overflow-x: hidden;
  padding: 20px;
}

.container {
  max-width: 700px;
  margin: 40px auto;
  background: var(--glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  padding: 40px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.1);
  animation: slideUp 0.5s ease;
  transition: background 0.4s ease, border-color 0.4s ease;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

h1 { font-size: 2.2rem; font-weight: 800; text-align: center; margin-bottom: 10px; color: var(--accent); }
.subtitle { text-align: center; color: var(--text-dim); margin-bottom: 30px; }

.error-msg{
  background: rgba(239,68,68,0.12);
  border: 1px solid var(--danger);
  color: var(--danger);
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 0.9rem;
  margin: -10px 0 18px;
  text-align: center;
}

/* ================= ONGLETS ================= */
.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 28px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  padding: 6px;
}
.tab-btn {
  background: transparent;
  border: none;
  color: var(--text-dim);
  padding: 12px 8px;
  border-radius: 10px;
  font-weight: 700;
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.25s;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.tab-btn .tab-icon { font-size: 1.3rem; }
.tab-btn:hover { color: var(--text); background: rgba(128,128,128,0.08); }
.tab-btn.active { background: var(--accent); color: #fff; }

.btn {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  color: var(--text);
  padding: 14px 24px;
  border-radius: 14px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
.btn-primary { background: var(--accent); color: #fff; border: none; }
.btn-success { background: var(--success); color: #fff; border: none; }
.btn-danger { background: var(--danger); color: #fff; border: none; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
.btn-full { grid-column: 1 / -1; }

input[type="text"] {
  width: 100%;
  padding: 14px 20px;
  background: var(--glass);
  border: 2px solid var(--glass-border);
  border-radius: 14px;
  color: var(--text);
  font-size: 1rem;
  margin: 10px 0 20px;
  transition: all 0.3s;
}
input[type="text"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }
input::placeholder { color: var(--text-dim); }

.category-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
.mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }

.cat-btn {
  padding: 16px 10px;
  background: var(--glass);
  border: 2px solid transparent;
  border-radius: 14px;
  cursor: pointer;
  transition: all 0.3s;
  text-align: center;
  font-weight: 600;
  color: var(--text);
}
.cat-btn:hover { background: rgba(128, 128, 128, 0.1); }
.cat-btn.active { border-color: var(--accent); background: rgba(56, 189, 248, 0.1); color: var(--accent); }
.cat-btn .icon { font-size: 2rem; display: block; margin-bottom: 6px; }

.game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
.lives { display: flex; gap: 6px; font-size: 1.5rem; }
.heart { transition: all 0.3s; }
.heart.lost { filter: grayscale(1) opacity(0.3); transform: scale(0.8); }

.combo {
  background: linear-gradient(135deg, #f59e0b, #ef4444);
  color: #fff;
  padding: 6px 14px;
  border-radius: 20px;
  font-weight: 700;
  font-size: 0.9rem;
  animation: pulse 1s infinite;
}
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

.timer-wrap { position: relative; width: 70px; height: 70px; margin: 0 auto 10px; }
.timer-svg { transform: rotate(-90deg); width: 100%; height: 100%; }
.timer-bg { fill: none; stroke: var(--glass-border); stroke-width: 6; }
.timer-fg { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 1s linear, stroke 0.3s; }
.timer-fg.warning { stroke: var(--warning); }
.timer-fg.danger { stroke: var(--danger); }
.timer-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.3rem; font-weight: 800; color: var(--text); }

.progress { height: 8px; background: var(--glass-border); border-radius: 4px; overflow: hidden; margin: 15px 0; }
.progress-fill { height: 100%; background: var(--accent); transition: width 0.5s ease; border-radius: 4px; }

.question { font-size: 1.25rem; font-weight: 600; text-align: center; margin: 25px 0; line-height: 1.4; color: var(--text); }

.options { display: flex; flex-direction: column; gap: 12px; }
.option {
  background: var(--glass);
  border: 2px solid var(--glass-border);
  color: var(--text);
  padding: 16px 20px;
  border-radius: 14px;
  cursor: pointer;
  font-size: 1rem;
  text-align: left;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 12px;
}
.option:hover:not(:disabled) { border-color: var(--accent); transform: translateX(4px); }
.option .letter { background: rgba(128,128,128,0.15); color: var(--text); width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
.option.correct { background: rgba(34, 197, 94, 0.15); border-color: var(--success); color: var(--success); }
.option.incorrect { background: rgba(239, 68, 68, 0.15); border-color: var(--danger); color: var(--danger); animation: shake 0.4s ease; }
.option.hidden { opacity: 0.2; pointer-events: none; text-decoration: line-through; }

@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

.powerups { display: flex; justify-content: center; gap: 12px; margin: 20px 0; }
.powerup {
  background: var(--glass);
  border: 2px solid var(--glass-border);
  color: var(--text);
  padding: 10px 18px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 0.95rem;
  font-weight: 600;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
}
.powerup:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-2px); }
.powerup:disabled { opacity: 0.3; cursor: not-allowed; }
.powerup .count { background: var(--accent); color: #fff; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 800; }

.result-circle { width: 160px; height: 160px; margin: 20px auto; position: relative; }
.result-circle svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.result-circle .bg { fill: none; stroke: var(--glass-border); stroke-width: 12; }
.result-circle .fg { fill: none; stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset 2s ease; }
.result-circle .pct { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2.2rem; font-weight: 800; color: var(--text); }

.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 0; }
.stats-grid-2 { grid-template-columns: 1fr 1fr; }
.stat-card { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 12px; padding: 15px; text-align: center; }
.stat-card .value { font-size: 1.6rem; font-weight: 800; color: var(--accent); }
.stat-card .label { font-size: 0.8rem; color: var(--text-dim); margin-top: 4px; }

.leaderboard { margin: 20px 0; }
.lb-row { display: grid; grid-template-columns: 40px 1fr auto auto; align-items: center; gap: 12px; padding: 12px 16px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 12px; margin-bottom: 8px; transition: all 0.3s; }
.lb-row:hover { transform: translateX(4px); border-color: var(--accent); }
.lb-row.top-1 { border-left: 4px solid #fbbf24; }
.lb-row.top-2 { border-left: 4px solid #94a3b8; }
.lb-row.top-3 { border-left: 4px solid #b45309; }
.lb-rank { font-size: 1.2rem; font-weight: 800; text-align: center; }
.lb-name { font-weight: 600; color: var(--text); }
.lb-score { color: var(--accent); font-weight: 700; }
.lb-date { color: var(--text-dim); font-size: 0.8rem; }

.theme-toggle {
  position: fixed; top: 20px; right: 20px;
  background: var(--glass); backdrop-filter: blur(10px);
  border: 1px solid var(--glass-border);
  width: 50px; height: 50px; border-radius: 50%;
  cursor: pointer; font-size: 1.5rem;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.3s; z-index: 100; color: var(--text);
}
.theme-toggle:hover { transform: rotate(30deg) scale(1.1); }

.badge { display: inline-block; padding: 4px 10px; border-radius: 10px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
.badge-at { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
.badge-nt { background: rgba(56, 189, 248, 0.15); color: var(--accent); }
.badge-mix { background: rgba(139, 92, 246, 0.15); color: #8b5cf6; }
.badge-ph { background: rgba(34, 197, 94, 0.15); color: var(--success); }

@media (max-width: 600px) {
  body { padding: 12px; }
  .container { padding: 22px 18px; margin: 12px auto; border-radius: 18px; }
  h1 { font-size: 1.6rem; }
  .subtitle { margin-bottom: 20px; }
  .question { font-size: 1.05rem; margin: 18px 0; }

  .theme-toggle { top: 12px; right: 12px; width: 42px; height: 42px; font-size: 1.2rem; }

  .tabs { grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; }
  .tab-btn { padding: 9px 4px; font-size: 0.7rem; }
  .tab-btn .tab-icon { font-size: 1.1rem; }

  .category-grid { grid-template-columns: 1fr; }
  .mode-grid { grid-template-columns: 1fr; }
  .btn-grid { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .stats-grid-2 { grid-template-columns: 1fr; }

  .powerups { flex-direction: column; }
  .powerup { justify-content: center; }

  .game-header { gap: 6px; }
  .timer-wrap { width: 58px; height: 58px; }
  .timer-text { font-size: 1.05rem; }

  .lb-row { grid-template-columns: 26px 1fr auto auto; gap: 8px; padding: 10px 12px; font-size: 0.85rem; }
  .lb-row > div:nth-child(2) { min-width: 0; overflow: hidden; }
  .lb-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; max-width: 100%; }
  .lb-date { white-space: nowrap; }
}

@media (max-width: 380px) {
  .tab-btn span:not(.tab-icon) { font-size: 0.62rem; }
  h1 { font-size: 1.4rem; }
  .cat-btn .icon { font-size: 1.6rem; }
}
</style>
</head>
<body>

<button class="theme-toggle" id="theme-btn" title="Changer de thème">🌙</button>
<div id="app"></div>

<script>
/* ============ BANQUE DE QUESTIONS (via l'API backend, plus de duplication) ============ */
let CATEGORY_COUNTS = { AT: 0, NT: 0, PH: 0, MIX: 0 };
let categoriesLoaded = false; // false tant qu'on n'a pas une réponse fiable (même via le cache SW)

/* Erreur enrichie : 'offline' = pas de réseau ET rien en cache pour cette requête,
   'network' = requête refusée/en échec alors qu'on est en ligne (souci serveur). */
function connectivityError(message) {
  const err = new Error(message);
  err.kind = navigator.onLine ? 'network' : 'offline';
  return err;
}

async function apiGetCategories() {
  let res;
  try {
    res = await fetch('/api/categories');
  } catch (e) {
    throw connectivityError('Échec du chargement des catégories');
  }
  if (!res.ok) throw connectivityError('Échec du chargement des catégories');
  const list = await res.json();
  const counts = {};
  list.forEach(c => { counts[c.code] = c.count; });
  categoriesLoaded = true;
  return counts;
}

/* Mappe le format renvoyé par le backend (question/options/correct_index/category/verse)
   vers le format interne utilisé par l'UI (q/o/a/cat/verse/id). */
function mapApiQuestion(q) {
  return { id: q.id, q: q.question, o: q.options, a: q.correct_index, cat: q.category, verse: q.verse };
}

async function apiGetQuestions(category, limit, excludeIds, playerName) {
  const params = new URLSearchParams({ category, limit: String(limit) });
  if (excludeIds && excludeIds.length) params.set('exclude', excludeIds.join(','));
  if (playerName) params.set('player', playerName);
  let res;
  try {
    res = await fetch(`/api/questions?${params.toString()}`);
  } catch (e) {
    throw connectivityError('Échec du chargement des questions');
  }
  if (!res.ok) throw connectivityError('Échec du chargement des questions');
  const list = await res.json();
  return list.map(mapApiQuestion);
}

/* Précharge les 4 catégories dans le cache du service worker (une requête suffit par
   catégorie : la clé de cache dans sw.js ignore déjà limit/exclude/player).
   Silencieux : si ça échoue, on retentera à la prochaine visite en ligne. */
async function preloadCategoriesForOffline(counts) {
  if (!('serviceWorker' in navigator) || !navigator.onLine) return;
  const cats = ['AT', 'NT', 'PH', 'MIX'];
  await Promise.all(cats.map(cat => {
    const limit = Math.min(counts[cat] || 30, 60); // assez de variété sans payload énorme
    return fetch(`/api/questions?category=${cat}&limit=${limit}`).catch(() => {});
  }));
}

async function apiRecordAnswer(playerName, questionId, correct) {
  try {
    await fetch('/api/answer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ player_name: playerName, question_id: questionId, correct }),
    });
  } catch (e) {
    /* Pas grave si hors-ligne : la répétition espacée reprendra à la prochaine connexion. */
  }
}

/* ============ STOCKAGE LOCAL (préférences uniquement : nom, thème) ============ */
async function storageGet(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw !== null ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}
async function storageSet(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    /* stockage indisponible : on continue sans bloquer le jeu */
  }
}

/* ============ API SERVEUR (scores/classement partagés entre joueurs) ============ */
async function apiSaveScore(entry) {
  const res = await fetch('/api/scores', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      player_name: entry.name,
      score: entry.score,
      total_questions: entry.total,
      category: entry.cat,
      mode: entry.mode,
      lives: entry.lives,
    }),
  });
  if (!res.ok) throw new Error('Échec de la sauvegarde du score');
  return res.json();
}
async function apiGetLeaderboard() {
  const res = await fetch('/api/scores');
  if (!res.ok) throw new Error('Échec du chargement du classement');
  return res.json();
}
async function apiGetMyStats(playerName) {
  const res = await fetch(`/api/scores/mine?player=${encodeURIComponent(playerName)}`);
  if (!res.ok) throw new Error('Échec du chargement des statistiques');
  return res.json();
}

/* ============ ÉTAT GLOBAL ============ */
const state = {
  playerName: '',
  category: 'MIX',
  mode: 'classic',
  questions: [],
  current: 0,
  score: 0,
  lives: 3,
  combo: 0,
  maxCombo: 0,
  powerups: { fifty: 1, skip: 1 },
  timer: null,
  timeLeft: 20,
  theme: 'dark',
  sound: true,
  screen: 'tabs',   // 'tabs' | 'playing' | 'result'
  tab: 'jouer',     // 'jouer' | 'categorie' | 'classement'
};

const app = document.getElementById('app');
const themeBtn = document.getElementById('theme-btn');

/* ============ THÈME ============ */
function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
  themeBtn.textContent = state.theme === 'dark' ? '☀️' : '🌙';
}
themeBtn.addEventListener('click', async () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  await storageSet('bible-quiz:theme', state.theme);
  applyTheme();
});

/* ============ SONS (Web Audio API) ============ */
let audioCtx;
function playSound(type) {
  if (!state.sound) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);

    const sounds = {
      correct: { freq: [523, 659, 784], type: 'sine', dur: 0.15 },
      wrong: { freq: [200, 150], type: 'sawtooth', dur: 0.2 },
      click: { freq: [800], type: 'sine', dur: 0.05 },
      win: { freq: [523, 659, 784, 1047], type: 'sine', dur: 0.2 },
      tick: { freq: [1000], type: 'sine', dur: 0.03 },
    };
    const s = sounds[type];
    o.type = s.type;
    g.gain.setValueAtTime(0.1, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + s.dur * s.freq.length);
    s.freq.forEach((f, i) => o.frequency.setValueAtTime(f, audioCtx.currentTime + i * s.dur));
    o.start();
    o.stop(audioCtx.currentTime + s.dur * s.freq.length);
  } catch (e) { /* audio indisponible, on ignore silencieusement */ }
}

/* ============ UTILITAIRES ============ */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const QUESTIONS_PER_ROUND = 10;

function seenKey(playerName, category, mode) {
  return `bible-quiz:seen:${playerName}:${category}:${mode}`;
}
async function getSeenIds(playerName, category, mode) {
  return await storageGet(seenKey(playerName, category, mode), []);
}
async function addSeenIds(playerName, category, mode, ids) {
  const current = await getSeenIds(playerName, category, mode);
  const merged = Array.from(new Set([...current, ...ids]));
  await storageSet(seenKey(playerName, category, mode), merged);
}
async function resetSeenIds(playerName, category, mode) {
  await storageSet(seenKey(playerName, category, mode), []);
}

function categoryLabel(cat) {
  if (cat === 'AT') return 'Ancien Testament';
  if (cat === 'NT') return 'Nouveau Testament';
  if (cat === 'PH') return 'Personnages & Héros';
  return 'Mixte';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

/* ============ ONGLETS (barre persistante hors partie) ============ */
function renderTabBar() {
  const tabs = [
    { id: 'jouer', icon: '🎮', label: 'Jouer' },
    { id: 'categorie', icon: '📚', label: 'Catégorie' },
    { id: 'classement', icon: '🏆', label: 'Classement' },
  ];
  return `
    <div class="tabs">
      ${tabs.map(t => `
        <button class="tab-btn ${state.tab === t.id ? 'active' : ''}" data-tab="${t.id}">
          <span class="tab-icon">${t.icon}</span>
          <span>${t.label}</span>
        </button>
      `).join('')}
    </div>
  `;
}

function bindTabBar() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.tab = btn.dataset.tab;
      renderApp();
    });
  });
}

/* ============ ROUTEUR PRINCIPAL ============ */
function renderApp() {
  if (state.screen === 'playing') { renderQuestion(); return; }
  if (state.screen === 'result') { return; } // showResult() gère déjà son propre rendu
  if (state.tab === 'jouer') return renderHomeTab();
  if (state.tab === 'categorie') return renderCategoryTab();
  if (state.tab === 'classement') return renderLeaderboardTab();
}

/* ============ ONGLET : JOUER ============ */
function renderHomeTab() {
  app.innerHTML = `
    <div class="container">
      <h1>📖 Bible Quiz</h1>
      <p class="subtitle">Teste tes connaissances avec style ✨</p>
      ${renderTabBar()}

      <input type="text" id="name" placeholder="Ton prénom..." value="${escapeHtml(state.playerName)}">
      <div id="name-error"></div>

      <div style="display:flex; align-items:center; justify-content:space-between; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 12px; padding: 12px 16px; margin: 10px 0 20px;">
        <span style="color: var(--text-dim); font-size:0.9rem;">📚 Catégorie sélectionnée</span>
        <span class="badge badge-${state.category==='MIX'?'mix':state.category.toLowerCase()}">${categoryLabel(state.category)}</span>
      </div>

      <h3 style="margin: 15px 0 10px; color: var(--text-dim); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;">🎮 Mode de jeu</h3>
      <div class="mode-grid">
        <div class="cat-btn ${state.mode==='classic'?'active':''}" data-mode="classic"><span class="icon">🎯</span>Classique<br><small style="opacity:0.7">jusqu'à 10 questions</small></div>
        <div class="cat-btn ${state.mode==='survival'?'active':''}" data-mode="survival"><span class="icon">❤️</span>Survie<br><small style="opacity:0.7">3 vies max</small></div>
      </div>

      <button class="btn btn-success btn-full" id="start-btn" style="width:100%; margin-top: 10px;"> Commencer</button>
    </div>
  `;

  bindTabBar();

  document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.cat) state.category = btn.dataset.cat;
      if (btn.dataset.mode) state.mode = btn.dataset.mode;
      renderHomeTab();
    });
  });

  document.getElementById('start-btn').addEventListener('click', startGame);
}

async function startGame() {
  const nameInput = document.getElementById('name');
  const errorBox = document.getElementById('name-error');
  const name = nameInput.value.trim();
  if (!name) {
    errorBox.innerHTML = `<p class="error-msg">Entre ton prénom pour commencer.</p>`;
    return;
  }

  state.playerName = name;
  await storageSet('bible-quiz:playerName', state.playerName);
  playSound('click');

  const totalInCategory = CATEGORY_COUNTS[state.category] || 0;
  if (totalInCategory === 0) {
    if (!categoriesLoaded) {
      errorBox.innerHTML = `<p class="error-msg">Tu es hors-ligne et cette catégorie n'a pas encore été mise en cache. Connecte-toi une fois pour pouvoir y jouer ensuite hors-ligne.</p>`;
    } else {
      errorBox.innerHTML = `<p class="error-msg">Aucune question dans cette catégorie.</p>`;
    }
    return;
  }

  const seenIds = await getSeenIds(state.playerName, state.category, state.mode);

  let selected;
  try {
    selected = await apiGetQuestions(state.category, QUESTIONS_PER_ROUND, seenIds, state.playerName);
  } catch (e) {
    if (e.kind === 'offline') {
      errorBox.innerHTML = `<p class="error-msg">Tu es hors-ligne et cette catégorie n'a pas encore été mise en cache. Connecte-toi une fois pour pouvoir y jouer ensuite hors-ligne.</p>`;
    } else {
      errorBox.innerHTML = `<p class="error-msg">Impossible de charger les questions (problème serveur, réessaie dans un instant).</p>`;
    }
    return;
  }

  if (selected.length === 0) {
    renderCategoryFinished(totalInCategory);
    return;
  }

  await addSeenIds(state.playerName, state.category, state.mode, selected.map(q => q.id));

  state.questions = selected;
  state.current = 0;
  state.score = 0;
  state.lives = 3;
  state.combo = 0;
  state.maxCombo = 0;
  state.powerups = { fifty: 1, skip: 1 };
  state.screen = 'playing';
  renderQuestion();
}

/* ============ ÉCRAN : CATÉGORIE TERMINÉE ============ */
function renderCategoryFinished(totalInCategory) {
  app.innerHTML = `
    <div class="container">
      <h1>🎉 Catégorie terminée !</h1>
      <p style="text-align:center;color:var(--text-dim);margin:16px 0;">
        Tu as répondu à toutes les questions de la catégorie <strong>${escapeHtml(categoryLabel(state.category))}</strong>
        en mode <strong>${state.mode === 'survival' ? 'Survie' : 'Classique'}</strong>
        (${totalInCategory} questions au total).
      </p>
      <p style="text-align:center;color:var(--text-dim);">Veux-tu rejouer depuis le début de cette catégorie ?</p>
      <div class="btn-grid" style="margin-top:20px;">
        <button class="btn btn-success btn-full" id="restart-cat-btn">🔄 Rejouer cette catégorie</button>
        <button class="btn" id="home-cat-btn">🏠 Accueil</button>
      </div>
    </div>
  `;

  document.getElementById('restart-cat-btn').addEventListener('click', async () => {
    await resetSeenIds(state.playerName, state.category, state.mode);
    startGame();
  });
  document.getElementById('home-cat-btn').addEventListener('click', () => {
    state.screen = 'tabs';
    state.tab = 'jouer';
    renderApp();
  });
}

/* ============ ÉCRAN DE JEU (pas d'onglets pendant une partie) ============ */
function renderQuestion() {
  clearInterval(state.timer);
  if (state.current >= state.questions.length || (state.mode === 'survival' && state.lives <= 0)) {
    return showResult();
  }

  const q = state.questions[state.current];
  const progress = (state.current / state.questions.length) * 100;
  state.timeLeft = 20;

  const hearts = [0,1,2].map(i => `<span class="heart ${i >= state.lives ? 'lost' : ''}">❤️</span>`).join('');

  const catLabels = { AT: 'Ancien Test.', NT: 'Nouveau Test.', PH: 'Personnages' };

  app.innerHTML = `
    <div class="container">
      <div class="game-header">
        <div>
          <div class="lives">${state.mode === 'survival' ? hearts : ''}</div>
          <small style="color:var(--text-dim)">Q${state.current+1}/${state.questions.length}</small>
        </div>
        <div style="text-align:center">
          <div class="timer-wrap">
            <svg class="timer-svg" viewBox="0 0 100 100">
              <circle class="timer-bg" cx="50" cy="50" r="45"/>
              <circle class="timer-fg" id="timer-fg" cx="50" cy="50" r="45" stroke-dasharray="283" stroke-dashoffset="0"/>
            </svg>
            <div class="timer-text" id="timer-text">20</div>
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-size:1.5rem;font-weight:800;color:var(--accent)">${state.score}</div>
          ${state.combo >= 2 ? `<div class="combo">🔥 x${state.combo}</div>` : ''}
        </div>
      </div>

      <div class="progress"><div class="progress-fill" style="width:${progress}%"></div></div>
      <div style="text-align:center; margin-bottom:15px;">
        <span class="badge badge-${q.cat.toLowerCase()}">${catLabels[q.cat] || q.cat}</span>
      </div>
      <div class="question">${escapeHtml(q.q)}</div>

      <div class="options" id="options">
        ${q.o.map((opt, i) => `<button class="option" data-i="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${escapeHtml(opt)}</span></button>`).join('')}
      </div>

      <div id="verse-ref" style="min-height:24px; text-align:center; margin:4px 0 12px; color:var(--text-dim); font-style:italic; opacity:0; transition:opacity 0.3s ease;"></div>

      <div class="powerups">
        <button class="powerup" id="pw-fifty" ${state.powerups.fifty<=0?'disabled':''}>🎯 50/50 <span class="count">${state.powerups.fifty}</span></button>
        <button class="powerup" id="pw-skip" ${state.powerups.skip<=0?'disabled':''}>⏭️ Passer <span class="count">${state.powerups.skip}</span></button>
      </div>
    </div>
  `;

  document.querySelectorAll('.option').forEach(btn => {
    btn.addEventListener('click', () => handleAnswer(parseInt(btn.dataset.i, 10)));
  });
  document.getElementById('pw-fifty').addEventListener('click', useFifty);
  document.getElementById('pw-skip').addEventListener('click', useSkip);

  startTimer();
}

function startTimer() {
  const fg = document.getElementById('timer-fg');
  const txt = document.getElementById('timer-text');
  if (!fg || !txt) return;
  const circumference = 283;

  state.timer = setInterval(() => {
    state.timeLeft--;
    txt.textContent = state.timeLeft;
    const offset = circumference * (1 - state.timeLeft / 20);
    fg.style.strokeDashoffset = offset;

    if (state.timeLeft <= 5) { fg.classList.add('danger'); fg.classList.remove('warning'); playSound('tick'); }
    else if (state.timeLeft <= 10) { fg.classList.add('warning'); }

    if (state.timeLeft <= 0) { clearInterval(state.timer); handleAnswer(-1); }
  }, 1000);
}

function handleAnswer(selected) {
  clearInterval(state.timer);
  const q = state.questions[state.current];
  const buttons = document.querySelectorAll('.option');
  buttons.forEach(b => b.disabled = true);
  const isCorrect = selected === q.a;

  if (isCorrect) {
    buttons[selected].classList.add('correct');
    state.score++;
    state.combo++;
    if (state.combo > state.maxCombo) state.maxCombo = state.combo;
    playSound('correct');
  } else {
    if (selected >= 0 && buttons[selected]) buttons[selected].classList.add('incorrect');
    if (buttons[q.a]) buttons[q.a].classList.add('correct');
    state.combo = 0;
    if (state.mode === 'survival') state.lives--;
    playSound('wrong');
  }

  if (state.playerName) apiRecordAnswer(state.playerName, q.id, isCorrect);

  const verseBox = document.getElementById('verse-ref');
  if (verseBox && q.verse) {
    verseBox.textContent = `📖 Référence : ${q.verse}`;
    verseBox.style.opacity = '1';
  }

  setTimeout(() => { state.current++; renderQuestion(); }, q.verse ? 2600 : 1200);
}

function useFifty() {
  if (state.powerups.fifty <= 0) return;
  state.powerups.fifty--;
  playSound('click');
  const q = state.questions[state.current];
  const wrongs = [0,1,2,3].filter(i => i !== q.a);
  const toHide = shuffle(wrongs).slice(0, 2);
  const optionEls = document.querySelectorAll('.option');
  toHide.forEach(i => { if (optionEls[i]) optionEls[i].classList.add('hidden'); });
  const btn = document.getElementById('pw-fifty');
  btn.disabled = true;
  btn.querySelector('.count').textContent = state.powerups.fifty;
}

function useSkip() {
  if (state.powerups.skip <= 0) return;
  state.powerups.skip--;
  playSound('click');
  clearInterval(state.timer);
  state.current++;
  renderQuestion();
}

/* ============ RÉSULTAT DE PARTIE ============ */
async function showResult() {
  clearInterval(state.timer);
  state.screen = 'result';
  const total = state.current;
  const pct = total ? Math.round(100 * state.score / total) : 0;
  const perfect = pct === 100 && total > 0;

  try {
    await apiSaveScore({
      name: state.playerName,
      score: state.score,
      total: total,
      cat: state.category,
      mode: state.mode,
      lives: state.lives,
    });
  } catch (e) {
    /* Le score n'a pas pu être envoyé au serveur (réseau hors-ligne, etc.) :
       on n'empêche pas l'affichage du résultat, mais il ne sera pas au classement. */
    console.error(e);
  }

  let hexColor = '#22c55e', msg = 'Parfait ! 🎉';
  if (pct < 100 && pct >= 80) { msg = 'Excellent !'; }
  else if (pct >= 60) { msg = 'Bien joué !'; hexColor = '#f59e0b'; }
  else if (pct >= 40) { msg = 'Pas mal !'; hexColor = '#f59e0b'; }
  else { msg = 'Continue à apprendre !'; hexColor = '#ef4444'; }

  app.innerHTML = `
    <div class="container">
      <h1>${perfect ? '🏆 VICTOIRE !' : '📊 Résultat'}</h1>
      <div class="result-circle">
        <svg viewBox="0 0 100 100">
          <circle class="bg" cx="50" cy="50" r="45"/>
          <circle class="fg" id="res-fg" cx="50" cy="50" r="45" stroke="${hexColor}" stroke-dasharray="283" stroke-dashoffset="283"/>
        </svg>
        <div class="pct" style="color:${hexColor}">${pct}%</div>
      </div>
      <p style="text-align:center;font-size:1.2rem;font-weight:600;margin:10px 0; color: var(--text);">${msg}</p>
      <p style="text-align:center;color:var(--text-dim)">${state.score} / ${total} bonnes réponses</p>
      <div class="stats-grid">
        <div class="stat-card"><div class="value">${state.score}</div><div class="label">✅ Correctes</div></div>
        <div class="stat-card"><div class="value">🔥 ${state.maxCombo}</div><div class="label">Combo max</div></div>
        ${state.mode === 'survival'
          ? `<div class="stat-card"><div class="value">${state.lives}/3</div><div class="label">❤️ Vies</div></div>`
          : `<div class="stat-card"><div class="value">${state.score}/${total}</div><div class="label">🎯 Précision</div></div>`}
      </div>
      <div class="btn-grid">
        <button class="btn btn-success btn-full" id="replay-btn">🔄 Rejouer</button>
        <button class="btn" id="lb-res-btn">🏆 Classement</button>
        <button class="btn" id="home-res-btn">🏠 Accueil</button>
      </div>
    </div>
  `;

  setTimeout(() => {
    const fg = document.getElementById('res-fg');
    if (fg) fg.style.strokeDashoffset = 283 * (1 - pct / 100);
  }, 100);
  if (perfect) playSound('win');

  document.getElementById('replay-btn').addEventListener('click', () => {
    state.screen = 'tabs';
    state.tab = 'jouer';
    startGame();
  });
  document.getElementById('lb-res-btn').addEventListener('click', () => {
    state.screen = 'tabs';
    state.tab = 'classement';
    renderApp();
  });
  document.getElementById('home-res-btn').addEventListener('click', () => {
    state.screen = 'tabs';
    state.tab = 'jouer';
    renderApp();
  });
}

/* ============ ONGLET : CLASSEMENT ============ */
async function renderLeaderboardTab() {
  app.innerHTML = `<div class="container"><h1>📖 Bible Quiz </h1>${renderTabBar()}<p style="text-align:center; color: var(--text-dim);">⏳ Chargement du classement...</p></div>`;
  bindTabBar();

  let sorted = [];
  try {
    sorted = await apiGetLeaderboard();
  } catch (e) {
    console.error(e);
  }

  let rowsHtml;
  if (sorted.length === 0) {
    rowsHtml = `<p style="text-align:center;color:var(--text-dim)">Aucun score pour le moment. Joue une partie pour apparaître ici !</p>`;
  } else {
    const medals = ['🥇','🥈','🥉'];
    rowsHtml = sorted.slice(0, 10).map((s, i) => {
      const pct = s.total ? Math.round(100 * s.score / s.total) : 0;
      const rank = i < 3 ? medals[i] : (i + 1);
      const catClass = (s.category || 'MIX').toLowerCase();
      return `<div class="lb-row ${i < 3 ? `top-${i+1}` : ''}">
        <div class="lb-rank">${rank}</div>
        <div><div class="lb-name">${escapeHtml(s.player_name)}</div><div class="lb-date">${escapeHtml((s.played_at || '').split('T')[0])} • <span class="badge badge-${catClass}">${escapeHtml(s.category || 'MIX')}</span></div></div>
        <div class="lb-score">${s.score}/${s.total}</div>
        <div style="color:var(--accent);font-weight:700">${pct}%</div>
      </div>`;
    }).join('');
  }

  // --- Section "Mes résultats", fusionnée dans le même onglet ---
  let statsHtml = '';
  if (!state.playerName) {
    statsHtml = `<p class="error-msg">Joue une partie pour voir apparaître tes statistiques personnelles ici.</p>`;
  } else {
    try {
      const mine = await apiGetMyStats(state.playerName);
      statsHtml = `
        <div class="stats-grid">
          <div class="stat-card"><div class="value">${mine.games}</div><div class="label">🎮 Parties</div></div>
          <div class="stat-card"><div class="value">${mine.avg_pct}%</div><div class="label">📈 Moyenne</div></div>
          <div class="stat-card"><div class="value">${mine.best_pct}%</div><div class="label">🏆 Record</div></div>
        </div>
        <div class="stats-grid stats-grid-2">
          <div class="stat-card"><div class="value">${mine.total_score}</div><div class="label">✅ Total bonnes réponses</div></div>
          <div class="stat-card"><div class="value">${mine.total_questions}</div><div class="label">📝 Total questions</div></div>
        </div>
      `;
    } catch (e) {
      console.error(e);
      statsHtml = `<p class="error-msg">Impossible de charger tes statistiques pour le moment.</p>`;
    }
  }

  app.innerHTML = `
    <div class="container">
      <h1>📖 Bible Quiz</h1>
      ${renderTabBar()}

      <h3 style="margin: 0 0 12px; color: var(--text-dim); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;">🏆 Classement général</h3>
      <div class="leaderboard">${rowsHtml}</div>

      <h3 style="margin: 24px 0 12px; color: var(--text-dim); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;">Mes résultats${state.playerName ? ` — ${escapeHtml(state.playerName)}` : ''}</h3>
      ${statsHtml}
    </div>
  `;
  bindTabBar();
}

/* ============ INITIALISATION ============ */
async function init() {
  try {
    state.playerName = await storageGet('bible-quiz:playerName', '');
    state.theme = await storageGet('bible-quiz:theme', 'dark');
  } catch (e) {
    /* valeurs par défaut déjà en place dans state */
  }
  applyTheme();
  try {
    CATEGORY_COUNTS = await apiGetCategories();
  } catch (e) {
    /* Hors-ligne au premier lancement : rien à afficher tant que le réseau ne revient pas. */
  }
  renderApp();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
    if (categoriesLoaded) {
      navigator.serviceWorker.ready
        .then(() => preloadCategoriesForOffline(CATEGORY_COUNTS))
        .catch(() => {});
    }
  }
}

init();
</script>
